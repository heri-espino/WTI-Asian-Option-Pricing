name: Remove merged packaging branch (one time)
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/prune-packaging-branch-once.yml"
permissions:
  contents: write
  pull-requests: read
jobs:
  cleanup:
    if: github.repository == 'heri-espino/WTI-Asian-Option-Pricing'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify PR, branch and main before deleting only merged branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MAIN_AT_TRIGGER: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request
          repo = os.environ["REPO"]
          base = "https://api.github.com/repos/" + repo
          branch = "chore/license-environments-and-packaging-2026-10-18"
          head_sha = "36f386734a7e1384bb1fc9e8a969e3ca166b6fe5"
          def api(method, route):
              req = urllib.request.Request(base+route,method=method,headers={
                  "Authorization":"Bearer "+os.environ["GH_TOKEN"],
                  "Accept":"application/vnd.github+json",
                  "X-GitHub-Api-Version":"2022-11-28"})
              with urllib.request.urlopen(req, timeout=30) as result:
                  body=result.read()
                  return json.loads(body) if body else None
          if api("GET","/git/ref/heads/main")["object"]["sha"] != os.environ["MAIN_AT_TRIGGER"]:
              raise RuntimeError("main changed; refuse to clean")
          actual={item["name"] for item in api("GET","/branches?per_page=100")}
          if actual != {"main",branch}:
              raise RuntimeError("Unexpected branches: "+repr(actual))
          ref="/git/ref/heads/"+urllib.parse.quote(branch,safe="/")
          if api("GET",ref)["object"]["sha"] != head_sha:
              raise RuntimeError("Packaging branch advanced; refuse to delete")
          pr=api("GET","/pulls/1")
          if pr["state"] != "closed" or not pr["merged_at"] or pr["head"]["ref"]!=branch or pr["head"]["sha"]!=head_sha:
              raise RuntimeError("PR #1 merge not verified")
          api("DELETE","/git/refs/heads/"+urllib.parse.quote(branch,safe="/"))
          remaining=[item["name"] for item in api("GET","/branches?per_page=100")]
          if remaining != ["main"]:
              raise RuntimeError("Unexpected branches after cleanup: "+repr(remaining))
          print("Only main remains.")
          PY
