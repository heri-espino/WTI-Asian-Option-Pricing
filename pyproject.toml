[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wti-asian-option-pricing"
version = "0.1.0"
description = "Bayesian posterior integration and volatility inputs for WTI Asian options"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Heriberto Espino-Montelongo" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["Asian options", "Bayesian inference", "WTI", "volatility", "option pricing"]
dependencies = ["numpy>=2.0", "pandas>=2.2", "scipy>=1.13"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "matplotlib>=3.9", "psutil>=6.0", "build>=1.2"]
market = ["yfinance>=1.4", "databento>=0.87,<0.88"]

[project.urls]
Repository = "https://github.com/heri-espino/WTI-Asian-Option-Pricing"
Documentation = "https://github.com/heri-espino/WTI-Asian-Option-Pricing/blob/main/SETUP.md"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["bayesian_asian_options*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
